<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Simple Website</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #243047;
      line-height: 1.6;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 48px 20px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 2.3rem;
    }

    main {
      max-width: 760px;
      margin: 32px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 5px 18px rgba(20, 40, 80, 0.08);
      text-align: center;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 20px;
      background: #2563eb;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      min-height: 1.5em;
      color: #2563eb;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 24px 16px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Website!</h1>
    <p>A simple website made with HTML and CSS.</p>
  </header>

  <main>
    <section class="card">
      <h2>About This Website</h2>
      <p>Hello! This is my first website. I created it while learning how to build websites.</p>
      <button type="button" onclick="showMessage()">Click Me</button>
      <p id="message" aria-live="polite"></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 My Simple Website</p>
  </footer>

  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "Thanks for visiting my website!";
    }
  </script>
</body>
</html>
